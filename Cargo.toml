[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["synth <synth@neonstack.dev>"]
repository = "https://github.com/synth/open_grid"
homepage = "https://github.com/synth/open_grid#readme"
keywords = ["mesh", "networking", "p2p", "encryption", "discovery"]
categories = ["network-programming", "cryptography"]

[workspace.dependencies]
open_grid_shared = { path = "crates/shared" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
noise-rust = "0.6"
x25519-dalek = "2"
mdns = "0.11"
rand = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
bytes = "1"
futures = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"
